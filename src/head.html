<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.162.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.162.0/examples/jsm/","cannon-es":"https://cdn.jsdelivr.net/npm/cannon-es@0.20.0/dist/cannon-es.js"}}</script>
<script type="module">
import * as T3 from 'three';
import {GLTFLoader} from 'three/addons/loaders/GLTFLoader.js';
import {EffectComposer} from 'three/addons/postprocessing/EffectComposer.js';
import {RenderPass} from 'three/addons/postprocessing/RenderPass.js';
import {ShaderPass} from 'three/addons/postprocessing/ShaderPass.js';
import {UnrealBloomPass} from 'three/addons/postprocessing/UnrealBloomPass.js';
import {Water} from 'three/addons/objects/Water.js';
T3.ColorManagement.enabled=false;
window.THREE=Object.assign({},T3,{GLTFLoader,EffectComposer,RenderPass,ShaderPass,UnrealBloomPass,Water});
try{ window.CANNON=await import('cannon-es'); }catch(e){ console.warn('Physics did not load',e); }
window.dispatchEvent(new Event('three-ready'));
</script>
